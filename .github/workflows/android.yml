name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    env:
      CI: true
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle JavaScript
        run: npx expo export --platform android --output-dir dist

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - uses: android-actions/setup-android@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Assemble APKs
        working-directory: android
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload standalone release APK
        uses: actions/upload-artifact@v7
        with:
          name: iliad-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload dev-client debug APK
        uses: actions/upload-artifact@v7
        with:
          name: iliad-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
